name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vibeguard_test
          POSTGRES_USER: vibeguard
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: apps/ingestion
        run: pip install -e ".[dev]"

      - name: Lint (dashboard)
        run: pnpm --filter dashboard lint

      - name: Lint (Python)
        working-directory: apps/ingestion
        run: ruff check src/ tests/

      - name: Test (Go)
        working-directory: apps/vgx
        env:
          DATABASE_URL: postgres://vibeguard:testpass@localhost:5432/vibeguard_test
        run: go test ./...

      - name: Test (Python)
        working-directory: apps/ingestion
        env:
          DATABASE_URL: postgres://vibeguard:testpass@localhost:5432/vibeguard_test
        run: pytest tests/ -v

      - name: Build (dashboard)
        run: pnpm --filter dashboard build

      - name: Build (Go)
        working-directory: apps/vgx
        run: |
          mkdir -p internal/embed/dist
          cp -r ../dashboard/dist/* internal/embed/dist/
          go build -o bin/vgx ./cmd/vgx
