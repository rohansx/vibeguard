services:
  vibeguard-api:
    container_name: vibeguard-api
    build:
      context: ..
      dockerfile: apps/vgx/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://vibeguard:${DB_PASSWORD:-vibeguard}@vibeguard-db:5432/vibeguard?sslmode=disable"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SPG_STORE_PATH: "/data/graph"
    volumes:
      - spgdata:/data/graph
    depends_on:
      vibeguard-db:
        condition: service_healthy
    restart: unless-stopped
    command: ["serve", "--api"]

  vibeguard-db:
    container_name: vibeguard-db
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vibeguard
      POSTGRES_USER: vibeguard
      POSTGRES_PASSWORD: "${DB_PASSWORD:-vibeguard}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  spgdata:
